openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Ember local-first productivity API — core loop for CLI and MCP clients.
servers:
  - url: /api
    description: Base API path (proxied from frontend; default http://localhost:8080/api)
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Dragon projects
  - name: tasks
    description: Project tasks
  - name: sessions
    description: Focus sessions
  - name: resume
    description: Resume card context
  - name: ai
    description: AI cognition engine
  - name: skills
    description: Dragon skill harness (invoke, inbox, verdict)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Hatch a new dragon project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by id
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project fields
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Archive project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update or action a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /sessions/start:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/end:
    post:
      operationId: endSession
      tags: [sessions]
      summary: End a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionRequest"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndSessionResponse"

  /sessions/project/{projectId}:
    get:
      operationId: listProjectSessions
      tags: [sessions]
      summary: Recent sessions for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /resume:
    get:
      operationId: getResume
      tags: [resume]
      summary: Resume card — where you left off and suggested next step
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resume context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResponse"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Whether AI provider is configured
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"

  /ai/extract-tasks:
    post:
      operationId: extractTasks
      tags: [ai]
      summary: Brain dump — extract tasks from unstructured text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTasksRequest"
      responses:
        "200":
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractionResult"
        "503":
          description: AI unavailable

  /ai/process-reflection:
    post:
      operationId: processReflection
      tags: [ai]
      summary: Process session reflection via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessReflectionRequest"
      responses:
        "200":
          description: Reflection processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExtractionResult"

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List registered skills in the harness catalog
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /dragons/{id}/skills:
    get:
      operationId: listDragonSkills
      tags: [skills]
      summary: Skills available to a dragon with maturity state
      parameters:
        - $ref: "#/components/parameters/DragonId"
      responses:
        "200":
          description: Dragon skills with maturity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DragonSkillEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /dragons/{id}/skills/{skillId}/run:
    post:
      operationId: invokeDragonSkill
      tags: [skills]
      summary: Invoke a skill on behalf of a dragon
      parameters:
        - $ref: "#/components/parameters/DragonId"
        - $ref: "#/components/parameters/SkillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeSkillRequest"
      responses:
        "201":
          description: Skill run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeSkillResponse"
        "402":
          description: Over monthly budget
        "403":
          description: Trust insufficient
        "404":
          $ref: "#/components/responses/NotFound"
        "428":
          description: High-cost confirmation required
        "503":
          description: AI unavailable

  /skill-runs/{id}:
    get:
      operationId: getSkillRun
      tags: [skills]
      summary: Get a skill run by id
      parameters:
        - $ref: "#/components/parameters/SkillRunId"
      responses:
        "200":
          description: Skill run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRun"
        "404":
          $ref: "#/components/responses/NotFound"

  /skill-runs/{id}/verdict:
    post:
      operationId: recordSkillVerdict
      tags: [skills]
      summary: Keeper verdict on a skill run
      parameters:
        - $ref: "#/components/parameters/SkillRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillVerdictRequest"
      responses:
        "200":
          description: Verdict recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillVerdictResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already verdicted

  /dragons/{id}/inbox:
    get:
      operationId: getDragonInbox
      tags: [skills]
      summary: Pending and recent skill runs for keeper review
      parameters:
        - $ref: "#/components/parameters/DragonId"
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /dragons/{id}/skill-runs:
    get:
      operationId: listDragonSkillRuns
      tags: [skills]
      summary: Recent skill runs for a dragon
      parameters:
        - $ref: "#/components/parameters/DragonId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillRun"

components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string

    DragonId:
      name: id
      in: path
      required: true
      schema:
        type: string

    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string

    SkillRunId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    DragonType:
      type: string
      enum: [cinder, moss, drift, frost]

    DragonStage:
      type: string
      enum: [egg, hatchling, adolescent, adult, ancient]

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        dragon_type: { $ref: "#/components/schemas/DragonType" }
        dragon_stage: { $ref: "#/components/schemas/DragonStage" }
        total_focus_minutes: { type: integer }
        project_summary: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_session_at: { type: string, format: date-time, nullable: true }
        last_decay_check: { type: string, format: date-time, nullable: true }
        is_archived: { type: integer }
      required:
        - id
        - name
        - dragon_type
        - dragon_stage
        - total_focus_minutes
        - project_summary
        - created_at
        - updated_at
        - is_archived

    CreateProjectRequest:
      type: object
      properties:
        name: { type: string }
        dragon_type: { $ref: "#/components/schemas/DragonType" }
        summary: { type: string }
      required: [name, dragon_type]

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        project_summary: { type: string }

    TaskStatus:
      type: string
      enum: [active, backlog, completed]

    TaskSource:
      type: string
      enum: [ai, user, reflection]

    Task:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        task_text: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { type: integer }
        task_order: { type: integer }
        source: { $ref: "#/components/schemas/TaskSource" }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
      required:
        - id
        - project_id
        - task_text
        - status
        - priority
        - task_order
        - source
        - created_at

    CreateTaskRequest:
      type: object
      properties:
        project_id: { type: string }
        task_text: { type: string }
        source: { $ref: "#/components/schemas/TaskSource" }
        status: { $ref: "#/components/schemas/TaskStatus" }
      required: [project_id, task_text]

    UpdateTaskRequest:
      type: object
      properties:
        action:
          type: string
          enum: [complete, move_to_active, move_to_backlog]
        task_text: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }

    Session:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, nullable: true }
        duration_minutes: { type: integer }
        reflection: { type: string, nullable: true }
        ai_summary: { type: string, nullable: true }
        tasks_completed_count: { type: integer }
        created_at: { type: string, format: date-time }
      required:
        - id
        - project_id
        - start_time
        - duration_minutes
        - tasks_completed_count
        - created_at

    StartSessionRequest:
      type: object
      properties:
        project_id: { type: string }
        task_ids:
          type: array
          items: { type: string }
      required: [project_id]

    EndSessionRequest:
      type: object
      properties:
        session_id: { type: string }
        reflection: { type: string }
        tasks_completed_count: { type: integer }
      required: [session_id]

    EndSessionResponse:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        project: { $ref: "#/components/schemas/Project" }
        previous_dragon_stage: { $ref: "#/components/schemas/DragonStage", nullable: true }

    ResumeResponse:
      type: object
      properties:
        status_summary: { type: string }
        suggested_next_step: { type: string }
        last_session_summary: { type: string, nullable: true }
        source:
          type: string
          enum: [ai, fallback]
      required: [status_summary, suggested_next_step, source]

    AiStatus:
      type: object
      properties:
        available: { type: boolean }
      required: [available]

    ExtractTasksRequest:
      type: object
      properties:
        project_id: { type: string }
        user_input: { type: string }
      required: [project_id, user_input]

    ProcessReflectionRequest:
      type: object
      properties:
        project_id: { type: string }
        session_id: { type: string }
        reflection: { type: string }
      required: [project_id, session_id, reflection]

    AiExtractionResult:
      type: object
      properties:
        new_active_tasks:
          type: array
          items: { type: string }
        new_backlog_tasks:
          type: array
          items: { type: string }
        completed_tasks:
          type: array
          items: { type: string }
        insights:
          type: array
          items: { type: string }
        blockers:
          type: array
          items: { type: string }
        summary_update: { type: string }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }
      required: [success]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    TrustBand:
      type: string
      enum: [paired, solo, autonomous]

    SkillMode:
      type: string
      enum: [paired, autonomous]

    SkillRunStatus:
      type: string
      enum: [pending, approved, edited, rejected, failed, over_budget]

    Verdict:
      type: string
      enum: [approve, edit, reject]

    Skill:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        agent_recipe_key: { type: string }
        default_trust_band: { $ref: "#/components/schemas/TrustBand" }
        cost_estimate_input_tokens: { type: integer }
        created_at: { type: string, format: date-time }
      required: [id, name, description, agent_recipe_key, default_trust_band, cost_estimate_input_tokens, created_at]

    DragonSkillMaturity:
      type: object
      properties:
        dragon_id: { type: string }
        skill_id: { type: string }
        runs: { type: integer }
        approvals: { type: integer }
        edits: { type: integer }
        rejections: { type: integer }
        current_trust: { $ref: "#/components/schemas/TrustBand" }
        locked_band: { $ref: "#/components/schemas/TrustBand", nullable: true }
        paused: { type: integer }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    DragonSkillEntry:
      type: object
      properties:
        skill: { $ref: "#/components/schemas/Skill" }
        maturity: { $ref: "#/components/schemas/DragonSkillMaturity" }
      required: [skill, maturity]

    SkillRun:
      type: object
      properties:
        id: { type: string }
        dragon_id: { type: string }
        skill_id: { type: string }
        project_id: { type: string }
        mode: { $ref: "#/components/schemas/SkillMode" }
        complexity: { type: string, enum: [simple, complex] }
        user_prompt: { type: string }
        system_prompt: { type: string }
        output_text: { type: string, nullable: true }
        user_edit: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SkillRunStatus" }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: number }
        ran_at: { type: string, format: date-time }
        verdicted_at: { type: string, format: date-time, nullable: true }
      required:
        - id
        - dragon_id
        - skill_id
        - project_id
        - mode
        - user_prompt
        - status
        - ran_at

    InvokeSkillRequest:
      type: object
      properties:
        user_prompt: { type: string }
        mode: { $ref: "#/components/schemas/SkillMode" }
        confirm_high_cost: { type: boolean }
      required: [user_prompt]

    InvokeSkillResponse:
      type: object
      properties:
        ok: { type: boolean }
        run: { $ref: "#/components/schemas/SkillRun" }
        error: { type: string }
        required_trust: { $ref: "#/components/schemas/TrustBand" }
        current_trust: { $ref: "#/components/schemas/TrustBand" }
        estimated_cost_usd: { type: number }

    SkillVerdictRequest:
      type: object
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        status:
          type: string
          enum: [approved, edited, rejected]
        user_edit: { type: string }
      required: []

    SkillVerdictResponse:
      type: object
      properties:
        ok: { type: boolean }
        run: { $ref: "#/components/schemas/SkillRun" }
        error: { type: string }

    InboxItem:
      type: object
      properties:
        run: { $ref: "#/components/schemas/SkillRun" }
        skill_name: { type: string }
        pause_state: { type: boolean }

    InboxResponse:
      type: object
      properties:
        pending:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        recently_handled:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        paused_skills:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string }
              skill_name: { type: string }
        high_cost_pending:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
